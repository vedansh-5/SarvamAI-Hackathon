<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VANS</title>
    <style>
      :root {
        --ink: #000;
        --paper: #f3f4ee;
        --paper-dim: rgba(243, 244, 238, 0.62);
        --volt: #ffd23f;
        --notch: 0px;
      }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: transparent; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none; user-select: none; cursor: default;
      }
      #pill {
        position: fixed; inset: 0;
        display: grid;
        grid-template-columns: 1fr var(--notch) 1fr;
        align-items: center;
        background: var(--ink);
        color: var(--paper);
        border-radius: 0 0 12px 12px;
      }
      #pill.bare { border-radius: 999px; grid-template-columns: auto 1fr; gap: 8px; padding: 0 12px; }
      #dot {
        justify-self: center;
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--volt);
        opacity: 0.85;
        transition: transform 160ms ease, opacity 160ms ease;
      }
      #pill:hover #dot { transform: scale(1.3); opacity: 1; }
      #pill.working #dot { animation: breathe 1.1s ease-in-out infinite; }
      @keyframes breathe { 50% { opacity: 0.25; transform: scale(0.8); } }
      #text {
        justify-self: center;
        font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
        color: var(--paper-dim);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
      }
      #pill.bare #text { justify-self: start; }
      #pill.guiding #text { color: var(--paper); }
      #gap { width: var(--notch); }
      #pill.bare #gap { display: none; }
      @media (prefers-reduced-motion: reduce) {
        #pill.working #dot { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="pill" title="VANS (⌥Space)">
      <span id="dot"></span>
      <span id="gap"></span>
      <span id="text"></span>
    </div>
    <script type="module" src="/src/notch.ts"></script>
  </body>
</html>
