<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VANS</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: transparent; overflow: hidden;
        -webkit-user-select: none; user-select: none; cursor: default;
      }
      #pill {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
      }
      #dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--volt);
        opacity: 0.9;
        box-shadow: 0 0 0 0 rgb(var(--volt-rgb) / 0);
        transition: transform 160ms ease, opacity 500ms ease, box-shadow 200ms ease;
      }
      #pill[data-calm="bright"] #dot { transform: scale(1.25); opacity: 1; transition-duration: 160ms; }
      #pill[data-calm="faded"] #dot { opacity: 0.35; }
      #pill[data-calm="out"] #dot { opacity: 0; transition-duration: 900ms; }
      #pill:hover #dot { transform: scale(1.25); opacity: 1; }
      #pill.working #dot { animation: breathe 1.1s ease-in-out infinite; }
      #pill.guiding #dot { opacity: 1; box-shadow: 0 0 0 3px rgb(var(--volt-rgb) / 0.3); }
      #pill.unwatched #dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--volt); }
      #pill.offering #dot { background: radial-gradient(circle, #fff 0 1.5px, var(--volt) 2px); }
      #pill.working #dot, #pill.guiding #dot, #pill.offering #dot { opacity: 1; }
      #pill.listening #dot { opacity: 1; transform: scale(1.35); animation: hear 1.2s ease-in-out infinite; }
      @keyframes breathe { 50% { opacity: 0.3; transform: scale(0.8); } }
      @keyframes hear { 50% { box-shadow: 0 0 0 4px rgb(var(--volt-rgb) / 0.35); } }
      @media (prefers-reduced-motion: reduce) {
        #pill.working #dot { animation: none; opacity: 1; }
        #pill.listening #dot { animation: none; box-shadow: 0 0 0 3px rgb(var(--volt-rgb) / 0.35); }
      }
    </style>
  </head>
  <body>
    <div id="pill" data-calm="faded" title="VANS (⌥Space)"><span id="dot"></span></div>
    <script type="module" src="/src/notch.ts"></script>
  </body>
</html>
