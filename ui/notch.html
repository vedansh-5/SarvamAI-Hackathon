<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VANS</title>
    <style>
      :root { --volt: #ffd23f; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: transparent; overflow: hidden;
        -webkit-user-select: none; user-select: none; cursor: default;
      }
      #pill {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
      }
      #dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--volt);
        opacity: 0.9;
        box-shadow: 0 0 0 0 rgba(255, 210, 63, 0);
        transition: transform 160ms ease, opacity 160ms ease, box-shadow 200ms ease;
      }
      #pill:hover #dot { transform: scale(1.25); opacity: 1; }
      #pill.working #dot { animation: breathe 1.1s ease-in-out infinite; }
      #pill.guiding #dot { opacity: 1; box-shadow: 0 0 0 3px rgba(255, 210, 63, 0.3); }
      #pill.unwatched #dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--volt); }
      @keyframes breathe { 50% { opacity: 0.3; transform: scale(0.8); } }
      @media (prefers-reduced-motion: reduce) {
        #pill.working #dot { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="pill" title="VANS (⌥Space)"><span id="dot"></span></div>
    <script type="module" src="/src/notch.ts"></script>
  </body>
</html>
