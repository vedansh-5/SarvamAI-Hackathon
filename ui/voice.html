<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VANS</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: transparent; overflow: hidden;
        -webkit-user-select: none; user-select: none; cursor: default;
        font: 500 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }
      #room {
        position: fixed; inset: 0;
        display: flex; align-items: flex-start; justify-content: center;
      }
      #capsule {
        display: inline-flex; align-items: center; gap: 10px;
        max-width: calc(100% - 24px); min-height: 36px; box-sizing: border-box;
        padding: 8px 16px; border-radius: 20px;
        background: rgba(18, 18, 20, 0.94); color: #f5f5f7;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28), inset 0 0 0 0.5px rgba(255, 255, 255, 0.12);
        opacity: 0; transform: translateY(-6px) scale(0.96);
        transition: opacity 160ms ease, transform 200ms cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      #capsule.on { opacity: 1; transform: none; }
      #bars { display: flex; align-items: center; gap: 3px; height: 18px; flex: none; }
      #bars i {
        display: block; width: 3px; height: 18px; border-radius: 2px;
        background: var(--volt);
        transform: scaleY(0.15); transform-origin: center;
        transition: transform 70ms linear;
      }
      #words {
        overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow-wrap: anywhere;
      }
      #words.hint { color: rgba(245, 245, 247, 0.55); }
      #capsule[data-state="thinking"] #bars i { animation: think 900ms ease-in-out infinite; }
      #capsule[data-state="thinking"] #bars i:nth-child(2) { animation-delay: 90ms; }
      #capsule[data-state="thinking"] #bars i:nth-child(3) { animation-delay: 180ms; }
      #capsule[data-state="thinking"] #bars i:nth-child(4) { animation-delay: 270ms; }
      #capsule[data-state="thinking"] #bars i:nth-child(5) { animation-delay: 360ms; }
      #capsule[data-state="heard"] #bars,
      #capsule[data-state="note"] #bars { display: none; }
      #capsule[data-state="note"] { font-weight: 400; font-size: 12px; }
      @keyframes think { 50% { transform: scaleY(0.45); } }
      @media (prefers-reduced-motion: reduce) {
        #capsule, #bars i { transition: none; }
        #capsule[data-state="thinking"] #bars i { animation: none; transform: scaleY(0.3); }
      }
    </style>
  </head>
  <body>
    <div id="room">
      <div id="capsule" data-state="listening" role="status" aria-live="polite">
        <div id="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div id="words"></div>
      </div>
    </div>
    <script type="module" src="/src/voice.ts"></script>
  </body>
</html>
