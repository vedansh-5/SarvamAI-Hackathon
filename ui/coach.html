<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VANS</title>
    <style>
      /* The panel's palette, kept in step with src/styles.css. The overlay is a
         separate window with no frosted material behind it, so the surface is
         carried at a higher opacity than the panel's 0.82 — the panel gets the
         rest of the way there from AppKit, and this has to do it alone or the
         text sits on whatever application is underneath. */
      :root {
        color-scheme: light;
        --surface-rgb: 234, 233, 233;
        --tint: 0.97;
        --ink: #201e1d;
        --ink-dim: rgba(29, 29, 31, 0.55);
        --accent: #007aff;
        --accent-soft: rgba(0, 122, 255, 0.12);
        --accent-ink: #0a4da3;
        --r-panel: 18px;
        --edge: rgba(0, 0, 0, 0.08);
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --surface-rgb: 58, 56, 56;
        --tint: 0.97;
        --ink: #f8f4f4;
        --ink-dim: rgba(245, 245, 247, 0.55);
        --accent: #0a84ff;
        --accent-soft: rgba(10, 132, 255, 0.22);
        --accent-ink: #e9f2ff;
        --edge: rgba(255, 255, 255, 0.12);
      }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: transparent; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        -webkit-user-select: none; user-select: none; cursor: default;
      }
      #stage { position: fixed; inset: 0; opacity: 0; transition: opacity 180ms ease; }
      #stage.on { opacity: 1; }
      svg { position: fixed; inset: 0; width: 100%; height: 100%; }

      #tip {
        position: fixed;
        max-width: 320px;
        padding: 12px 14px;
        border-radius: var(--r-panel);
        background: rgba(var(--surface-rgb), var(--tint));
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        backdrop-filter: blur(20px) saturate(180%);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28), 0 0 0 0.5px var(--edge) inset;
        color: var(--ink);
        font-size: 14px;
        line-height: 1.45;
        letter-spacing: -0.01em;
        transform: translateY(6px) scale(0.98);
        opacity: 0;
        transition: left 320ms cubic-bezier(0.16, 1, 0.3, 1),
                    top 320ms cubic-bezier(0.16, 1, 0.3, 1),
                    transform 220ms cubic-bezier(0.25, 0.1, 0.25, 1),
                    opacity 220ms ease;
        pointer-events: none;
      }
      #tip.on { transform: translateY(0) scale(1); opacity: 1; }
      #detail {
        display: block;
        margin-top: 8px;
        padding: 5px 9px;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-size: 13px;
        font-weight: 550;
        letter-spacing: 0.01em;
        font-variant-ligatures: none;
      }
      #detail[hidden] { display: none; }
      #hint {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        letter-spacing: 0.01em;
        color: var(--ink-dim);
      }
      #arrow { transition: opacity 200ms ease; }

      /* The ring and the arrow carry the accent too. Set here rather than on the
         elements, so the one palette decides it: a CSS rule beats a presentation
         attribute, which is what the markup still has for anything that does not
         reach a stylesheet. */
      #corners, #arrow { stroke: var(--accent); }
      #ripple { stroke: var(--accent); }
      #spotlight-glow { stroke: var(--accent); }
      /* The ghost cursor: a soft, rounded triangle in the accent colour with a
         glow of the same colour. Deliberately not shaped like a mouse pointer —
         it should read as VANS moving, never as the person's own cursor having
         jumped. It turns to face where it is going, and lands tip first. */
      #ghost { transition: opacity 180ms ease; pointer-events: none; }
      #ghost-body {
        transform-origin: 0 0;
        transition: transform 110ms ease-out;
        filter: drop-shadow(0 0 7px var(--accent)) drop-shadow(0 0 2px var(--accent));
      }
      #ghost-shape { fill: var(--accent); stroke: var(--accent); }
      #ghost.pressing #ghost-body { transform: scale(0.82); }
      #ghost-press { transform-origin: center; }
      #ghost.landed #ghost-press { animation: ghost-press 520ms ease-out 1; }
      @keyframes ghost-press {
        from { r: 4; opacity: 0.9; }
        to   { r: 30; opacity: 0; }
      }

      #caption {
        position: fixed;
        left: 0; top: 0;
        max-width: 260px;
        padding: 5px 10px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.005em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25), 0 0 10px var(--accent-soft);
        opacity: 0;
        transition: opacity 160ms ease;
        pointer-events: none;
        will-change: transform;
      }
      #caption.on { opacity: 1; }
      #caption small {
        font-weight: 500;
        opacity: 0.75;
        margin-left: 6px;
      }
      #tip.quiet { display: none; }

      #trail-line { stroke: var(--accent); }
      .trail-dot circle { fill: rgba(var(--surface-rgb), 0.95); stroke: var(--accent); }
      .trail-dot text {
        fill: var(--accent);
        font: 700 10px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        text-anchor: middle;
        dominant-baseline: central;
      }

      #step {
        display: block;
        font-size: 11px;
        font-weight: 590;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <svg id="art" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="halo">
            <stop offset="55%" stop-color="black" stop-opacity="1" />
            <stop offset="100%" stop-color="black" stop-opacity="0" />
          </radialGradient>
          <mask id="cut">
            <rect width="100%" height="100%" fill="white" />
            <circle id="spotlight-halo" cx="0" cy="0" r="0" fill="url(#halo)" />
            <rect id="spotlight-hole" x="0" y="0" width="0" height="0" rx="8" fill="black" />
          </mask>
          <marker id="arrowhead" viewBox="0 0 10 10" refX="8.5" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="rgba(10,132,255,0.95)" />
          </marker>
        </defs>
        <rect width="100%" height="100%" fill="rgba(0,0,0,0.34)" mask="url(#cut)" />
        <rect id="spotlight-inner" x="0" y="0" width="0" height="0" rx="8"
              fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="2" />
        <rect id="spotlight-glow" x="0" y="0" width="0" height="0" rx="11"
              fill="none" stroke="rgba(10,132,255,0.6)" stroke-width="3">
          <animate attributeName="opacity" values="0.85;0.3;0.85" dur="1.8s" repeatCount="indefinite" />
        </rect>
        <path id="corners" d="" fill="none" stroke="rgba(10,132,255,0.95)"
              stroke-width="3" stroke-linecap="round" />
        <path id="arrow" d="" fill="none" stroke="rgba(10,132,255,0.9)" stroke-width="2.5"
              stroke-linecap="round" marker-end="url(#arrowhead)" opacity="0" />

        <g id="done" opacity="0">
          <circle id="done-ring" cx="0" cy="0" r="17" fill="rgba(48,209,88,0.18)"
                  stroke="rgba(48,209,88,0.95)" stroke-width="2.5" />
          <path id="done-tick" d="" fill="none" stroke="rgba(48,209,88,1)" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g id="tap" opacity="0">
          <circle id="ripple" cx="0" cy="0" r="14" fill="none"
                  stroke="rgba(10,132,255,0.75)" stroke-width="2">
            <animate attributeName="r" values="10;26;10" dur="1.6s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.9;0;0.9" dur="1.6s" repeatCount="indefinite" />
          </circle>
          <g id="caret" opacity="0">
            <rect x="-1.2" y="-11" width="2.4" height="22" rx="1.2" fill="rgba(10,132,255,0.95)">
              <animate attributeName="opacity" values="1;0.1;1" dur="1.1s" repeatCount="indefinite" />
            </rect>
          </g>
          <g id="cursor">
            <path d="M 0 0 L 0 18 L 4.6 13.6 L 7.4 19.6 L 10.6 18 L 7.9 12.2 L 14 12 Z"
                  fill="#ffffff" stroke="rgba(0,0,0,0.55)" stroke-width="1.2"
                  stroke-linejoin="round" />
            <animateTransform attributeName="transform" type="translate"
                              values="0 0; 0 -4; 0 0" dur="1.6s" repeatCount="indefinite" />
          </g>
        </g>
        <g id="trail">
          <path id="trail-line" d="" fill="none" stroke-width="1.5"
                stroke-dasharray="3 5" stroke-linecap="round" opacity="0.7" />
          <g id="trail-dots"></g>
        </g>
        <g id="ghost" opacity="0">
          <circle id="ghost-press" cx="0" cy="0" r="4" fill="none"
                  stroke="rgba(10,132,255,0.9)" stroke-width="2.5" opacity="0" />
          <g id="ghost-body">
            <!-- Points along +x with the rounded tip at the origin, so rotating the
                 group turns it to face its heading and the tip is what lands. The
                 thick stroke in the fill colour is what rounds the corners. -->
            <path id="ghost-shape" d="M -3 0 L -20 -9.5 L -20 9.5 Z"
                  stroke-width="5" stroke-linejoin="round" />
          </g>
        </g>
      </svg>
      <div id="tip">
        <span id="step"></span><span id="text"></span>
        <span id="detail" hidden></span>
        <span id="hint">⌥Space for Next or Stop</span>
      </div>
      <div id="caption"></div>
    </div>
    <script type="module" src="/src/coach.ts"></script>
  </body>
</html>
