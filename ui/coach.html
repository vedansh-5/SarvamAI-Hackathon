<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VANS</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: transparent; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        -webkit-user-select: none; user-select: none; cursor: default;
      }
      #stage { position: fixed; inset: 0; opacity: 0; transition: opacity 180ms ease; }
      #stage.on { opacity: 1; }
      svg { position: fixed; inset: 0; width: 100%; height: 100%; }

      #tip {
        position: fixed;
        max-width: 320px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(28, 28, 30, 0.92);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        backdrop-filter: blur(20px) saturate(180%);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), 0 0 0 0.5px rgba(255, 255, 255, 0.12) inset;
        color: #f5f5f7;
        font-size: 14px;
        line-height: 1.45;
        letter-spacing: -0.01em;
        transform: translateY(6px) scale(0.98);
        opacity: 0;
        transition: left 320ms cubic-bezier(0.16, 1, 0.3, 1),
                    top 320ms cubic-bezier(0.16, 1, 0.3, 1),
                    transform 220ms cubic-bezier(0.25, 0.1, 0.25, 1),
                    opacity 220ms ease;
        pointer-events: none;
      }
      #tip.on { transform: translateY(0) scale(1); opacity: 1; }
      #step {
        display: block;
        font-size: 11px;
        font-weight: 590;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8e8e93;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <svg id="art" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <mask id="cut">
            <rect width="100%" height="100%" fill="white" />
            <rect id="spotlight-hole" x="0" y="0" width="0" height="0" rx="8" fill="black" />
          </mask>
        </defs>
        <rect width="100%" height="100%" fill="rgba(0,0,0,0.42)" mask="url(#cut)" />
        <rect id="spotlight-inner" x="0" y="0" width="0" height="0" rx="8"
              fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="2" />
        <rect id="spotlight-glow" x="0" y="0" width="0" height="0" rx="11"
              fill="none" stroke="rgba(10,132,255,0.6)" stroke-width="3">
          <animate attributeName="opacity" values="0.85;0.3;0.85" dur="1.8s" repeatCount="indefinite" />
        </rect>
      </svg>
      <div id="tip"><span id="step"></span><span id="text"></span></div>
    </div>
    <script type="module" src="/src/coach.ts"></script>
  </body>
</html>
