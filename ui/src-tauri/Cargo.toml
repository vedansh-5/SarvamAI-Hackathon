[package]
name = "vans"
version = "0.1.0"
description = "Visual Agent Navigation System"
edition = "2021"

[lib]
name = "vans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tauri-plugin-global-shortcut = "2.3.2"
base64 = "0.22"
window-vibrancy = "0.8.0"

# Frontmost-application lookup goes through AppKit directly. The alternative,
# asking System Events over osascript, needs an Accessibility grant the user
# has not given and costs ~50-100ms on a path that runs every time the panel
# is summoned.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSWindow", "NSResponder", "NSPanel", "NSEvent", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSNotification", "NSOperation", "block2"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindow", "libc"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFDictionary", "CFNumber", "CFString"] }
