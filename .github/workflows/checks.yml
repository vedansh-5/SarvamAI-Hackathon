name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Vet the Mac-only build
        run: CGO_ENABLED=0 GOOS=darwin go vet ./...
      - name: Tests
        run: go test ./...
      - name: The tester engine carries no instructions
        run: |
          mkdir -p "$RUNNER_TEMP/tester.app"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags tester -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/tester.app/vans-engine" ./cmd/vans-engine
          python3 -I infra/mac/check-bundle.py "$RUNNER_TEMP/tester.app"

  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Form tests
        run: node --test worker/handle.test.mjs
